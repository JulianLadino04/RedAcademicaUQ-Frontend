<div class="estadisticas-page">

  <section class="estadisticas-header">
    <h2 class="titulo-principal">Panel de Estadísticas</h2>
    <p class="subtitulo">Visualización general de la actividad en la plataforma</p>
  </section>

  <section class="estadisticas-layout">

    <aside class="panel-lateral">

      <div class="filtros-card">
        <label for="tipoGrafica" class="filtro-label">
          Estadística a visualizar
        </label>

        <select
          id="tipoGrafica"
          class="form-select filtro-select"
          [(ngModel)]="graficaSeleccionada">

          <option value="materias">Materias más solicitadas</option>
          <option value="asesores">Asesores más activos</option>
          <option value="asesoriasEstado">Asesorías por estado</option>
          <option value="solicitudesEstado">Solicitudes por estado</option>

        </select>
      </div>

      <div class="resumen-card">
        <h4 class="resumen-titulo">Datos visibles</h4>

        <div
          class="dato-item"
          *ngFor="let item of obtenerResumenDatos()">

          <span class="dato-nombre">{{ item.nombre }}</span>
          <strong class="dato-valor">{{ item.total }}</strong>

        </div>

        <p
          class="empty-text"
          *ngIf="obtenerResumenDatos().length === 0">
          No hay datos disponibles.
        </p>
      </div>

    </aside>

    <section class="estadistica-card">

      <h3 class="estadistica-titulo">
        {{ obtenerTituloGrafica() }}
      </h3>

      <div class="grafica-container">
        <canvas
          baseChart
          [data]="obtenerDatosGrafica()"
          [options]="obtenerOpcionesGrafica()"
          [type]="obtenerTipoGrafica()">
        </canvas>
      </div>

    </section>

  </section>

</div>
