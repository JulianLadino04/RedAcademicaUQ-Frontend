<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card login-card shadow">

    <div class="card-body">

      <h3 class="text-center mb-4">Cambiar contraseña</h3>

      <form [formGroup]="registroForm" (ngSubmit)="cambiarPassword()">

        <!-- Correo -->
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            formControlName="correo"
            placeholder="ejemplo@correo.com"
          >
        </div>

        <!-- Código -->
        <div class="mb-3">
          <label class="form-label">Código de verificación</label>
          <input
            type="text"
            class="form-control"
            formControlName="codigoVerificacion"
            maxlength="6"
            placeholder="123456"
          >

          <div class="text-danger mt-1"
          *ngIf="registroForm.get('codigoVerificacion')?.invalid && registroForm.get('codigoVerificacion')?.touched">
            El código debe tener 6 dígitos
          </div>
        </div>

        <!-- Nueva contraseña -->
        <div class="mb-3">
          <label class="form-label">Nueva contraseña</label>
          <input
            type="password"
            class="form-control"
            formControlName="passwordNueva"
            placeholder="Nueva contraseña"
          >
        </div>

        <!-- Confirmar contraseña -->
        <div class="mb-3">
          <label class="form-label">Confirmar contraseña</label>
          <input
            type="password"
            class="form-control"
            #confirmPassword
            placeholder="Confirmar contraseña"
          >

          <div class="text-danger mt-1"
          *ngIf="confirmPassword.value !== registroForm.get('passwordNueva')?.value && confirmPassword.value.length > 0">
            Las contraseñas no coinciden
          </div>
        </div>

        <!-- Botón -->
        <div class="d-grid mb-3">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="registroForm.invalid || confirmPassword.value !== registroForm.get('passwordNueva')?.value"
          >
            Cambiar contraseña
          </button>
        </div>

        <!-- Volver -->
        <div class="text-center">
          <a class="link-secondary" (click)="volver()" style="cursor:pointer">
            Volver
          </a>
        </div>

      </form>

    </div>

  </div>

</div>
